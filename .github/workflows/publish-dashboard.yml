name: Publish tennis liquidity dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-dashboard.yml"
      - "scripts/publish_dashboard.py"
      - "tennis_betting/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download prior performance history
        shell: bash
        run: |
          status=$(curl --silent --show-error --location \
            --output previous-history.json \
            --write-out '%{http_code}' \
            "https://adambyrne.github.io/tennis-exchange-liquidity-scraper/history.json?run=${GITHUB_RUN_ID}")
          if [ "$status" = "404" ]; then
            printf '[]\n' > previous-history.json
          elif [ "$status" != "200" ]; then
            echo "Could not load previous performance history (HTTP $status)." >&2
            exit 1
          fi
      - name: Scrape current markets and build site
        run: python -m scripts.publish_dashboard --output-directory site --history-file previous-history.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
